name: Core manager and editor regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell and editor/core safety
        run: python3 -m unittest discover -s tests -p 'test_managers.py' -v
