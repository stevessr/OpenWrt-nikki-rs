name: Clash configuration workbench tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  config-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mikefarah yq
        run: |
          curl -fsSL --retry 3 https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64 -o /tmp/yq
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: Run config and core regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate LuCI JavaScript syntax
        run: |
          find luci-app-nikki-rs/htdocs/luci-static/resources -name '*.js' -print0 |
            xargs -0 -n 1 node --check


  subboost-rs-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch current SubBoost RS feature source
        uses: actions/checkout@v4
        with:
          repository: stevessr/subboost
          ref: feat/subboost-rs-parity-a53
          path: subboost-src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subboost-src/rusted
      - name: Compile and test Rust + SQLite server and HTTP API
        run: cargo test --manifest-path subboost-src/rusted/Cargo.toml --all-targets
      - name: Check frontend syntax and canonical module catalog
        run: |
          node --check subboost-src/rusted/ui/app.js
          (cd subboost-src && node rusted/scripts/sync-modules.cjs --check)
      - name: Validate procd and administration shell scripts
        run: |
          sh -n subboost-src/rusted/openwrt/subboost-rs.init
          sh -n subboost-src/rusted/openwrt/subboost-rsctl
      - uses: goto-bus-stop/setup-zig@v2
      - name: Install Rust Zig cross-compiler
        run: cargo install cargo-zigbuild --locked
      - name: Build x86_64 and ARM64 musl binaries
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --manifest-path subboost-src/rusted/Cargo.toml --release --target "$target"
            test -s "subboost-src/rusted/target/$target/release/subboost-rs"
            file "subboost-src/rusted/target/$target/release/subboost-rs"
          done

      - name: Native router server HTTP + SQLite lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/subboost-src/rusted/target/x86_64-unknown-linux-musl/release/subboost-rs"
          export SUBBOOST_DB="$RUNNER_TEMP/subboost-smoke.sqlite"
          export SUBBOOST_TOKEN_FILE="$RUNNER_TEMP/subboost-smoke.token"
          export SUBBOOST_BIND=127.0.0.1:38641
          export SUBBOOST_ALLOW_PRIVATE_SOURCES=1
          "$binary" > "$RUNNER_TEMP/subboost-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.request
          import urllib.error
          from urllib.parse import quote
          base = 'http://127.0.0.1:38641'
          token_file = pathlib.Path(os.environ['SUBBOOST_TOKEN_FILE'])
          for _ in range(100):
              try:
                  with urllib.request.urlopen(base+'/api/health/live', timeout=1) as response:
                      assert json.load(response)['database'] == 'sqlite'
                  break
              except (OSError, AssertionError):
                  time.sleep(.1)
          else:
              raise SystemExit('Native HTTP server did not become healthy')
          token = token_file.read_text().strip()
          def request(path, *, method='GET', body=None, authorized=True):
              data = json.dumps(body).encode() if body is not None else None
              headers = {'Content-Type':'application/json'}
              if authorized: headers['Authorization'] = 'Bearer '+token
              req = urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=5) as response:
                  return json.loads(response.read()),response.status
          try:
              request('/api/subscriptions',authorized=False)
              raise SystemExit('Unauthenticated access unexpectedly allowed')
          except urllib.error.HTTPError as err:
              assert err.code == 401
          row,_ = request('/api/subscriptions',method='POST',body={
              'name':'CI profile','source_urls':[],
              'manual_yaml':'proxies:\n  - {name: Test, type: ss, server: example.org, port: 8388, cipher: aes-128-gcm, password: test}\n',
              'rules_text':'MATCH,Proxy'
          })
          req = urllib.request.Request(base+'/api/subscriptions/'+quote(row['token'])+'/config.yaml?target=clash-rs')
          with urllib.request.urlopen(req,timeout=5) as response:
              yaml = response.read().decode()
          assert 'Test' in yaml and 'MATCH,Proxy' in yaml, yaml
          templates,_=request('/api/templates')
          assert len(templates)>=3
          made,_=request('/api/templates',method='POST',body={
              'name':'CI preset','description':'test','manual_yaml':'dns:\n  enable: true',
              'rules_text':'MATCH,Proxy'
          })
          assert made['built_in'] is False
          _,code=request('/api/subscriptions/'+row['id']+'/schedule',method='PUT',
              body={'interval_seconds':360})
          assert code == 200
          scheduled,_=request('/api/subscriptions/'+row['id']+'/schedule')
          assert scheduled['interval_seconds'] == 360
          assert scheduled['next_refresh_at']>0
          catalog,_=request('/api/modules')
          assert len(catalog)==36
          assert sum(len(m['rules']) for m in catalog)==94
          selected,_=request('/api/subscriptions/'+row['id']+'/modules',
              method='PUT',body={'enabled':['select','auto','ai','final']})
          assert len(selected)==4
          req=urllib.request.Request(base+'/api/subscriptions/'+row['token']+
              '/config.yaml?target=clash-rs')
          with urllib.request.urlopen(req,timeout=5) as response:
              content=response.read().decode()
              assert '🤖 AI 服务' in content
              assert 'subboost-openai' in content
              assert '/etc/nikki-rs/providers/rule' in content
          filt,_=request('/api/subscriptions/'+row['id']+'/filter',method='PUT',body={
              'enabled':True,'includeRegexes':['Test'],'excludeRegexes':['expired']
          })
          assert filt['enabled'] is True
          req=urllib.request.Request(base+'/api/subscriptions/'+quote(row['token'])+
              '/config.yaml?target=clash-rs')
          with urllib.request.urlopen(req,timeout=5) as response:
              assert b'Test' in response.read()
              assert response.headers.get('profile-update-interval')=='1'
              assert response.headers.get('content-disposition','').startswith('attachment;')
          try:
              request('/api/subscriptions/'+row['id']+'/schedule',
                  method='PUT',body={'interval_seconds':1})
              raise AssertionError('Invalid auto-refresh interval accepted')
          except urllib.error.HTTPError as err:
              assert err.code==400
          # Verify independent source caches and the partial-failure fallback
          # against a real local HTTP subscription provider.
          import threading
          from http.server import HTTPServer, BaseHTTPRequestHandler
          class SourceHandler(BaseHTTPRequestHandler):
              fail_one=False
              fail_all=False
              def log_message(self,*args):
                  return
              def do_GET(self):
                  if self.fail_all or (self.fail_one and self.path=='/two'):
                      self.send_response(503)
                      self.end_headers()
                      return
                  name='One' if self.path=='/one' else 'Two'
                  body=('proxies:\n  - {name: '+name+', type: ss, '+
                        'server: example.org, port: 8388, cipher: aes-128-gcm, password: test}\n').encode()
                  self.send_response(200)
                  self.send_header('Content-Type','application/yaml')
                  self.send_header('Subscription-Userinfo',
                      'upload='+('1024' if name=='One' else '2048')+
                      '; download=512; total='+('8192' if name=='One' else '16384')+
                      '; expire='+('1800000000' if name=='One' else '1700000000'))
                  self.send_header('Content-Length',str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          local=HTTPServer(('127.0.0.1',38642),SourceHandler)
          thread=threading.Thread(target=local.serve_forever,daemon=True)
          thread.start()
          try:
              profile,_=request('/api/subscriptions',method='POST',body={
                  'name':'Dual source','source_urls':[
                      'http://127.0.0.1:38642/one',
                      'http://127.0.0.1:38642/two'],
                  'manual_yaml':'','rules_text':'MATCH,Proxy'})
              refreshed,_=request('/api/subscriptions/'+profile['id']+'/refresh',method='POST')
              assert 'One' in refreshed['nodes_yaml'] and 'Two' in refreshed['nodes_yaml']
              info,_=request('/api/subscriptions/'+profile['id']+'/info')
              assert info['upload']==3072 and info['total']==24576
              assert info['expire']==1700000000
              req=urllib.request.Request(base+'/api/subscriptions/'+profile['token']+
                  '/config.yaml?target=clash-rs')
              with urllib.request.urlopen(req,timeout=5) as response:
                  assert 'upload=3072' in response.headers['subscription-userinfo']
              SourceHandler.fail_one=True
              refreshed,_=request('/api/subscriptions/'+profile['id']+'/refresh',method='POST')
              assert 'One' in refreshed['nodes_yaml'] and 'Two' in refreshed['nodes_yaml']
              assert '503' in refreshed['last_error']
              info,_=request('/api/subscriptions/'+profile['id']+'/info')
              assert info['upload']==3072 and info['total']==24576
              SourceHandler.fail_all=True
              try:
                  request('/api/subscriptions/'+profile['id']+'/refresh',method='POST')
                  raise AssertionError('All-source outage returned success')
              except urllib.error.HTTPError as e:
                  assert e.code==502
              previous,_=request('/api/subscriptions/'+profile['id'])
              assert 'One' in previous['nodes_yaml'] and 'Two' in previous['nodes_yaml']
              assert previous['revision'] > profile['revision']
              edited,_=request('/api/subscriptions/'+profile['id'],method='PUT',body={
                  'name':'Dual source edited','source_urls':profile['source_urls'],
                  'manual_yaml':'','rules_text':'MATCH,DIRECT'})
              assert 'One' in edited['nodes_yaml'] and 'Two' in edited['nodes_yaml']
              changed,_=request('/api/subscriptions/'+profile['id'],method='PUT',body={
                  'name':'New sources','source_urls':['http://127.0.0.1:38642/new'],
                  'manual_yaml':'','rules_text':'MATCH,DIRECT'})
              assert changed['nodes_yaml']=='' and changed['revision']>edited['revision']
              info,_=request('/api/subscriptions/'+profile['id']+'/info')
              assert info=={}, info
          finally:
              local.shutdown()
          print('Native API + SQLite + templates + schedule + filter + provider outage recovery succeeded')
          PY
