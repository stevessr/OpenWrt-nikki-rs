name: package

on:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
      upload_feed:
        type: boolean
        default: false
      nightly:
        type: boolean
        default: false
      include_subboost:
        type: boolean
        default: false
      artifact_retention_days:
        type: number
        default: 1
    secrets:
      KEY_BUILD:
        required: false
      PRIVATE_KEY:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # SubBoost runs as a hosted service; only its architecture-independent
      # LuCI frontend belongs on the router. Keep the upstream repo as source
      # of truth rather than retaining an outdated vendored copy.
      - name: Check out current SubBoost LuCI package
        if: inputs.include_subboost
        uses: actions/checkout@v6
        with:
          repository: stevessr/subboost
          ref: main
          path: .package-subboost
          persist-credentials: false

      - name: Record exact SubBoost source commit
        if: inputs.include_subboost
        run: git -C .package-subboost rev-parse HEAD > SUBBOOST_SOURCE.txt

      - name: Install native tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake meson ninja-build pkg-config libssl-dev zlib1g-dev fakeroot

      - name: Cache native packaging tools
        uses: actions/cache@v4
        with:
          path: .build-tools/bin
          key: native-packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/packaging/setup-tools.sh') }}

      - name: Build native tools
        run: |
          bash scripts/packaging/setup-tools.sh
          echo "$GITHUB_WORKSPACE/.build-tools/bin" >> "$GITHUB_PATH"

      - name: Update core to the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASH_RS_CACHE_DIR: .package-cache
        run: bash scripts/packaging/update-clash-rs.sh

      - name: Stamp nightly package versions
        if: inputs.nightly
        env:
          NIGHTLY_BUILD_NUMBER: ${{ github.run_number }}
          SUBBOOST_SOURCE_DIR: ${{ inputs.include_subboost && '.package-subboost' || '' }}
        run: python3 scripts/packaging/stamp-nightly.py

      - name: Cache prebuilt core archives
        uses: actions/cache@v4
        with:
          path: .package-cache
          key: core-archives-${{ hashFiles('clash-rs/Makefile') }}

      - name: Test packaging behavior
        run: python3 -m unittest discover -s tests -p 'test_packaging.py' -v

      - name: Prepare common files and five prebuilt cores
        env:
          SUBBOOST_SOURCE_DIR: ${{ inputs.include_subboost && '.package-subboost' || '' }}
        run: |
          python3 scripts/packaging/pack.py prepare
          # Artifact uploads normalize file modes; transport the payload as tar
          # so scripts stay executable and UCI configuration stays mode 0600.
          tar -czf package-inputs.tar.gz .package-work .build-tools/bin

      - name: Upload SubBoost source provenance
        if: inputs.include_subboost
        uses: actions/upload-artifact@v7
        with:
          name: subboost-source-revision
          path: SUBBOOST_SOURCE.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload prepared files and native tools
        uses: actions/upload-artifact@v7
        with:
          name: package-inputs
          retention-days: 1
          compression-level: 0
          path: package-inputs.tar.gz

  package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [openwrt-24.10, openwrt-25.12, SNAPSHOT]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: package-inputs

      - name: Restore native tool permissions
        run: |
          tar -xzf package-inputs.tar.gz
          echo "$GITHUB_WORKSPACE/.build-tools/bin" >> "$GITHUB_PATH"

      - name: Install archive ownership tool
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Package each architecture and index the feeds
        env:
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SIGN_PACKAGES: ${{ inputs.sign }}
          REQUIRE_SUBBOOST: ${{ inputs.include_subboost }}
        run: |
          options=()
          if [[ "$SIGN_PACKAGES" == true ]]; then options+=(--sign); fi
          python3 scripts/packaging/pack.py build --branch '${{ matrix.branch }}' "${options[@]}"
          verify_options=()
          if [[ "$REQUIRE_SUBBOOST" == true ]]; then verify_options+=(--require-subboost); fi
          python3 scripts/packaging/verify.py --branch '${{ matrix.branch }}' "${verify_options[@]}"

      - name: Archive feed tree for publishing
        if: inputs.upload_feed
        run: tar -czf 'feed_nikki_rs_${{ matrix.branch }}.tar.gz' -C .package-output public

      - name: Upload release archives
        uses: ./.github/actions/upload-packages
        with:
          branch: ${{ matrix.branch }}
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload feed tree
        if: inputs.upload_feed
        uses: actions/upload-artifact@v7
        with:
          name: feed_nikki_rs_${{ matrix.branch }}
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 0
          path: feed_nikki_rs_${{ matrix.branch }}.tar.gz
